name: Build & Deploy Spring Boot to EC2

on:
  push:
    branches: [ main ]   # change to your branch name if needed

defaults:
  run:
    working-directory: demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Build Docker image using your Dockerfile in the repo root
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/spring-backend:latest .

      # Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}        # 3.216.78.179
          username: ${{ secrets.EC2_USER }}    # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}      # contents of key1.pem
          script: |
            # Login to Docker Hub from EC2
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/spring-backend:latest

            # Stop & remove old container if it exists
            docker stop spring-backend || true
            docker rm spring-backend || true

            # Run new container
            docker run -d \
              --name spring-backend \
              -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/spring-backend:latest
